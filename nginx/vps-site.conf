# ═══════════════════════════════════════════════════════════════════════════════
# Reference: System Nginx Site Config for Blue/Green Deployment
# ═══════════════════════════════════════════════════════════════════════════════
#
# Place this file at: /etc/nginx/sites-available/expenso
# Enable with: sudo ln -s /etc/nginx/sites-available/expenso /etc/nginx/sites-enabled/
# Reload: sudo nginx -s reload
#
# The deploy script updates the line:
#   set $active_upstream blue;
# to switch traffic between Blue (port 3000) and Green (port 3001).
# ═══════════════════════════════════════════════════════════════════════════════

upstream blue {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream green {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # This variable is rewritten by the deploy script during Blue/Green switches
    set $active_upstream blue;

    location / {
        proxy_pass http://$active_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint for nginx itself
    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}

