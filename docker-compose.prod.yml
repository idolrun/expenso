services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Blue / Green Application Containers
  # ═══════════════════════════════════════════════════════════════════════════════
  # Only ONE receives live traffic at a time (controlled by system nginx).
  # Blue binds host port 3000; Green binds host port 3001.
  # System nginx proxies to whichever port is active.
  #
  # NOTE: The database (expenso-db-1) is a STANDALONE container managed
  # outside this compose file. It must already be running and attached to
  # the expenso-net network before these services start.
  # ═══════════════════════════════════════════════════════════════════════════════

  app-blue:
    image: ${BLUE_IMAGE:-${REGISTRY:-docker.io}/${IMAGE_NAME:-devidolrun/expenso}:latest}
    container_name: expenso-blue
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    # NO depends_on — the standalone DB is not managed by this compose file.
    # The CI/CD workflow uses --no-deps on docker compose up to guarantee
    # compose never tries to create or wait for a db service.
    networks:
      - expenso-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app-green:
    image: ${GREEN_IMAGE:-${REGISTRY:-docker.io}/${IMAGE_NAME:-devidolrun/expenso}:latest}
    container_name: expenso-green
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3000"
    # NO depends_on — see app-blue comment above.
    networks:
      - expenso-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  expenso-net:
    driver: bridge
