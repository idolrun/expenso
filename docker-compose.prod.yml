services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Blue / Green Application Containers
  # ═══════════════════════════════════════════════════════════════════════════════
  # Only ONE receives live traffic at a time (controlled by system nginx).
  # Blue binds host port 3000; Green binds host port 3001.
  # System nginx proxies to whichever port is active.
  #
  # NOTE: The database (expenso-db-1) is a STANDALONE container managed
  # outside this compose file. It must already be running and attached to
  # the expenso-net network before these services start.
  #
  # There is intentionally no db service and no depends_on. CI/CD uses
  # --no-deps so Compose never creates, recreates, or waits on the database.
  # ═══════════════════════════════════════════════════════════════════════════════

  app-blue:
    image: ${BLUE_IMAGE:-docker.io/devidolrun/expenso:latest}
    container_name: expenso-blue
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # .env.production uses db, which only resolves inside Compose-managed DNS.
      # The production database is the standalone container on expenso-net.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@expenso-db-1:5432/${POSTGRES_DB}"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - expenso-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app-green:
    image: ${GREEN_IMAGE:-docker.io/devidolrun/expenso:latest}
    container_name: expenso-green
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # .env.production uses db, which only resolves inside Compose-managed DNS.
      # The production database is the standalone container on expenso-net.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@expenso-db-1:5432/${POSTGRES_DB}"
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - expenso-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  expenso-net:
    # This bridge already exists on the VPS and contains expenso-db-1.
    # Mark it external so Compose never creates or destroys an isolated network.
    external: true
