services:
  # Blue/green application services only.
  # The database is a standalone container named expenso-db-1 and is never managed by Compose.
  app-blue:
    image: ${BLUE_IMAGE:-docker.io/devidolrun/expenso:latest}
    container_name: expenso-blue
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Override DATABASE_URL from .env.production because "db" DNS is not valid for standalone DB container.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@expenso-db-1:5432/${POSTGRES_DB}
    ports:
      # Bind to loopback only. Nginx is the only public ingress.
      - "127.0.0.1:3000:3000"
    networks:
      - expenso-net
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Swarm-only deploy config intentionally omitted because this stack runs with docker compose up.
    # read_only intentionally omitted because Next.js standalone writes runtime files outside /tmp.
    # user intentionally omitted because image does not guarantee UID/GID 1001 exists.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app-green:
    image: ${GREEN_IMAGE:-docker.io/devidolrun/expenso:latest}
    container_name: expenso-green
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Override DATABASE_URL from .env.production because "db" DNS is not valid for standalone DB container.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@expenso-db-1:5432/${POSTGRES_DB}
    ports:
      # Bind to loopback only. Nginx is the only public ingress.
      - "127.0.0.1:3001:3000"
    networks:
      - expenso-net
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Swarm-only deploy config intentionally omitted because this stack runs with docker compose up.
    # read_only intentionally omitted because Next.js standalone writes runtime files outside /tmp.
    # user intentionally omitted because image does not guarantee UID/GID 1001 exists.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  expenso-net:
    # This network already exists on the VPS and includes expenso-db-1.
    # external: true prevents Compose from creating a separate isolated network.
    external: true
