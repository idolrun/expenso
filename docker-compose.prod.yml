services:
  db:
    image: postgres:16.8-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - expenso_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    # Prevent container from gaining new capabilities
    cap_drop:
      - ALL

  app:
    image: ${REGISTRY:-docker.io}/${IMAGE_NAME:-devidolrun/expenso}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - expenso_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      # Kubernetes-style readiness for future migration
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    # ── Container Security Hardening ──
    # Read-only root filesystem — immutability at runtime
    read_only: true
    # Drop ALL Linux capabilities; the app binds to port 3000 (>1024) so
    # NET_BIND_SERVICE is unnecessary.
    cap_drop:
      - ALL
    # Prevent privilege escalation (e.g. setuid binaries)
    security_opt:
      - no-new-privileges:true
    # Explicit non-root UID/GID (must match Dockerfile USER)
    user: "1001:1001"
    # Writable tmpfs mounts for any ephemeral file I/O
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    # Limit log size to prevent disk exhaustion
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  expenso_net:
    driver: bridge

volumes:
  db_data:
