name: Build, Security Scan & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: devidolrun/expenso
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Quality Gate
  # ═══════════════════════════════════════════════════════════════════════════
  quality:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # prisma.config.ts requires DATABASE_URL to be resolvable even for
      # `prisma generate`, which does not actually connect to the database.
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.3
        with:
          package_json_file: package.json
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Integration Tests
  # ═══════════════════════════════════════════════════════════════════════════
  integration-test:
    name: Integration Tests
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # NOTE: TEST_DB_PASSWORD is NOT in the listed production secrets.
    # It should be added to GitHub secrets; the fallback hardcodes a test-only
    # password that must match the postgres service below.
    env:
      TEST_DB_USER: expenso_test
      TEST_DB_NAME: expensodb_test
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}
      DATABASE_URL: postgresql://expenso_test:${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}@localhost:5432/expensodb_test
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: expenso_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}
          POSTGRES_DB: expensodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenso_test -d expensodb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.3
        with:
          package_json_file: package.json
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Deploy migrations
        run: |
          for i in 1 2 3; do
            echo ">>> Migration attempt $i..."
            pnpm run db:deploy && exit 0
            sleep 3
          done
          echo "Migrations failed"
          exit 1

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "Container status:"
          docker inspect "${{ job.services.postgres.id }}" --format='{{.State.Status}} | {{.State.Health.Status}}' 2>/dev/null || true
          echo "Logs:"
          docker logs "${{ job.services.postgres.id }}" 2>&1 || true

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Build, Scan, SBOM & Sign
  # ═══════════════════════════════════════════════════════════════════════════
  build-scan-sign:
    name: Build, Scan & Sign Image
    needs: [integration-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      app-digest: ${{ steps.build-app.outputs.digest }}
      migrate-digest: ${{ steps.build-migrate.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ═══════════════════════════════════════════════════════════════════════
      # Build & Push App Image (production runtime — minimal, no Prisma CLI)
      # ═══════════════════════════════════════════════════════════════════════
      - name: Extract Docker metadata (app)
        id: meta-app
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        id: build-app
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./Dockerfile
          target: app
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
          provenance: true
          sbom: true

      # ═══════════════════════════════════════════════════════════════════════
      # Build & Push Migrate Image (dedicated migration runner — has Prisma CLI)
      # ═══════════════════════════════════════════════════════════════════════
      # Shares build cache with the app image (deps + builder stages are reused).
      # ═══════════════════════════════════════════════════════════════════════
      - name: Build and push migrate image
        id: build-migrate
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-migrate
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Cache Trivy DB
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy container scan (app image)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          scanners: 'vuln'
          ignore-unfixed: true

      - name: Gate on CRITICAL
        run: |
          if [ ! -f trivy-container-results.sarif ]; then
            echo "::warning::SARIF missing; skipping gate."
            exit 0
          fi
          COUNT=$(grep -o '"severity": "CRITICAL"' trivy-container-results.sarif | wc -l || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT CRITICAL finding(s). Review Security tab."
            exit 1
          fi
          echo "No CRITICAL vulnerabilities."

      - name: Ensure SARIF exists
        if: always()
        run: |
          if [ ! -f trivy-container-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","informationUri":"https://github.com/aquasecurity/trivy"}},"results":[]}]}' > trivy-container-results.sarif
          fi

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3.28.16
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign app image
        run: |
          echo "App digest: ${{ steps.build-app.outputs.digest }}"
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-app.outputs.digest }}

      - name: Sign migrate image
        run: |
          echo "Migrate digest: ${{ steps.build-migrate.outputs.digest }}"
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-migrate.outputs.digest }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. Run DB Migrations (before deployment — never inside containers)
  # ═══════════════════════════════════════════════════════════════════════════
  run-migrations:
    name: Run DB Migrations
    needs: [build-scan-sign]
    runs-on: ubuntu-24.04
    # 10 minutes: image pull can take 2-3 min, probe 30s, migration itself
    # can run for several minutes on a large pending set.
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy migrations on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Must be >= timeout-minutes so the SSH step doesn't get killed
          # by the runner while the shell script is still running.
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_DEPLOY_PATH }}"

            echo "════════════════════════════════════════════════════════════════"
            echo "  DB MIGRATIONS"
            echo "  Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-scan-sign.outputs.migrate-digest }}"
            echo "════════════════════════════════════════════════════════════════"

            # ── Docker Hub auth (required before any pull on the VPS) ─────────
            # Unauthenticated pulls hit Docker Hub rate limits (100/6h per IPv4).
            # Private images would fail entirely without login.
            echo ">>> Authenticating to Docker Hub on VPS..."
            printf '%s' "${{ secrets.DOCKER_PASSWORD }}" | \
              docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo ">>> Ensuring Docker network exists..."
            docker network create expenso-net || true

            echo ">>> Ensuring database container is attached to expenso-net..."
            docker network connect expenso-net expenso-db-1 2>/dev/null || true

            echo ">>> Pulling migration image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-scan-sign.outputs.migrate-digest }}

            echo ">>> Loading environment..."
            set -a
            source .env.production
            set +a

            # ── Fix hostname for Docker network resolution ────────────────────
            # .env.production may use "localhost" or "db" (docker-compose
            # service name). Neither resolves for plain `docker run` containers.
            # The actual Postgres container name is "expenso-db-1".
            DB_HOST="expenso-db-1"
            POSTGRES_USER="${POSTGRES_USER:-expenso}"
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-}"
            POSTGRES_DB="${POSTGRES_DB:-expensodb}"
            DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:5432/${POSTGRES_DB}"

            # Log connection details (password masked)
            echo ">>> Database host:     ${DB_HOST}"
            echo ">>> Database port:     5432"
            echo ">>> Database user:     ${POSTGRES_USER}"
            echo ">>> Database name:     ${POSTGRES_DB}"
            echo ">>> DATABASE_URL:      postgresql://${POSTGRES_USER}:****@${DB_HOST}:5432/${POSTGRES_DB}"

            # ── Verify DB is reachable AND accepting connections ──────────────
            echo ">>> Probing database with pg_isready (auth-verified)..."
            DB_READY=false
            for i in $(seq 1 10); do
              if docker run --rm --network expenso-net postgres:16-alpine \
                pg_isready -h "${DB_HOST}" -p 5432 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" >/dev/null 2>&1; then
                echo ">>> Database is ready and accepting connections (attempt $i/10)"
                DB_READY=true
                break
              fi
              echo ">>> DB not ready, attempt $i/10..."
              sleep 3
            done

            if [ "$DB_READY" != "true" ]; then
              echo "ERROR: Cannot reach database at ${DB_HOST}:5432"
              echo ">>> Docker networks:"
              docker network ls
              echo ">>> Containers on expenso-net (names):"
              docker network inspect expenso-net --format '{{range .Containers}}{{.Name}} {{end}}' || true
              echo ">>> Containers on expenso-net (names+IPs):"
              docker network inspect expenso-net --format '{{range .Containers}}{{.Name}}={{.IPv4Address}} {{end}}' || true
              echo ">>> Full network inspect:"
              docker network inspect expenso-net || true
              exit 1
            fi

            # ── Run migrations ────────────────────────────────────────────────
            echo ">>> Running prisma migrate deploy..."
            docker run --rm \
              --network expenso-net \
              -e DATABASE_URL="$DATABASE_URL" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-scan-sign.outputs.migrate-digest }} \
              ./node_modules/.bin/prisma migrate deploy --schema=./prisma/schema.prisma

            echo "════════════════════════════════════════════════════════════════"
            echo "  MIGRATIONS COMPLETE"
            echo "════════════════════════════════════════════════════════════════"

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. Production Blue/Green Deploy (INLINE — no external scripts)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production (Blue/Green)
    needs: [run-migrations, build-scan-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Blue/Green deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_DEPLOY_PATH }}"

            echo ">>> Syncing latest deploy artifacts from git..."
            git pull origin main

            COMPOSE_FILE="docker-compose.prod.yml"
            STATE_FILE=".bluegreen.state"
            NGINX_SITE="${NGINX_SITE_PATH:-/etc/nginx/sites-available/expenso}"
            NEW_DIGEST="${{ needs.build-scan-sign.outputs.app-digest }}"
            REGISTRY="${REGISTRY:-docker.io}"
            IMAGE_NAME="${IMAGE_NAME:-devidolrun/expenso}"
            FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}@${NEW_DIGEST}"

            echo ">>> Working directory: $(pwd)"
            echo ">>> Disk: $(df -h . | tail -1)"

            echo ">>> Authenticating to Docker Hub on VPS..."
            printf '%s' "${{ secrets.DOCKER_PASSWORD }}" | \
              docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            ACTIVE_COLOR=$(grep -oP 'set\s+\$active_upstream\s+\K\w+' "$NGINX_SITE" 2>/dev/null || true)
            if [ -z "$ACTIVE_COLOR" ] || { [ "$ACTIVE_COLOR" != "blue" ] && [ "$ACTIVE_COLOR" != "green" ]; }; then
              ACTIVE_COLOR="blue"
            fi

            if [ "$ACTIVE_COLOR" = "blue" ]; then
              TARGET_COLOR="green"
              TARGET_PORT=3001
            else
              TARGET_COLOR="blue"
              TARGET_PORT=3000
            fi

            echo ">>> Loading production environment variables..."
            set -a
            source .env.production
            set +a

            [ -f "$STATE_FILE" ] && source "$STATE_FILE" || true
            BLUE_DIGEST="${BLUE_DIGEST:-}"
            GREEN_DIGEST="${GREEN_DIGEST:-}"

            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  BLUE/GREEN DEPLOY"
            echo "  Active: $ACTIVE_COLOR  →  Target: $TARGET_COLOR (port $TARGET_PORT)"
            echo "  Image:  $FULL_IMAGE"
            echo "════════════════════════════════════════════════════════════════"

            echo ">>> [1/5] Cleaning up existing $TARGET_COLOR container..."
            docker compose -f "$COMPOSE_FILE" rm -sf --no-deps "app-$TARGET_COLOR" 2>/dev/null || \
              docker compose -f "$COMPOSE_FILE" rm -sf "app-$TARGET_COLOR" 2>/dev/null || true
            docker rm -f "expenso-$TARGET_COLOR" 2>/dev/null || true

            echo ">>> [2/5] Pulling image for $TARGET_COLOR..."
            docker pull "$FULL_IMAGE"

            if [ "$TARGET_COLOR" = "green" ]; then
              export GREEN_IMAGE="$FULL_IMAGE"
            else
              export BLUE_IMAGE="$FULL_IMAGE"
            fi

            echo ">>> [3/5] Starting $TARGET_COLOR container..."
            docker compose -f "$COMPOSE_FILE" up -d --no-deps "app-$TARGET_COLOR"

            echo ">>> [4/5] Health check on $TARGET_COLOR (localhost:$TARGET_PORT)..."
            HEALTHY=false
            for i in $(seq 1 10); do
              echo ">>>   Attempt $i/10..."
              if curl -sf "http://127.0.0.1:$TARGET_PORT/api/health" >/dev/null 2>&1; then
                echo ">>>   HTTP 200 OK"
                HEALTHY=true
                break
              fi
              # Also show Docker health status for observability
              DOCKER_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "expenso-$TARGET_COLOR" 2>/dev/null || echo "unknown")
              echo ">>>   Docker health: $DOCKER_HEALTH"
              sleep 3
            done

            if [ "$HEALTHY" != "true" ]; then
              echo ""
              echo "ERROR: $TARGET_COLOR failed health checks."
              docker logs --tail=100 "expenso-$TARGET_COLOR" || true
              echo ">>> Destroying $TARGET_COLOR container..."
              docker compose -f "$COMPOSE_FILE" rm -sf --no-deps "app-$TARGET_COLOR" 2>/dev/null || \
                docker compose -f "$COMPOSE_FILE" rm -sf "app-$TARGET_COLOR" 2>/dev/null || true
              docker rm -f "expenso-$TARGET_COLOR" 2>/dev/null || true
              echo ">>> Kept $ACTIVE_COLOR running. Users unaffected."
              echo "════════════════════════════════════════════════════════════════"
              echo "  DEPLOY FAILED — No traffic was switched"
              echo "════════════════════════════════════════════════════════════════"
              exit 1
            fi

            echo ">>> [5/5] Switching nginx from $ACTIVE_COLOR → $TARGET_COLOR..."
            sudo sed -i "s/set \$active_upstream [a-z]*;/set \$active_upstream $TARGET_COLOR;/g" "$NGINX_SITE"

            echo ">>> Testing nginx config..."
            sudo nginx -t

            echo ">>> Reloading nginx gracefully..."
            sudo nginx -s reload

            # ── Step 4: Grace period & cleanup ──────────────────────────────
            echo ">>> Waiting 10s for connection drain..."
            sleep 10

            echo ">>> Stopping previous $ACTIVE_COLOR container..."
            docker compose -f "$COMPOSE_FILE" stop "app-$ACTIVE_COLOR" 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" rm -sf --no-deps "app-$ACTIVE_COLOR" 2>/dev/null || \
              docker compose -f "$COMPOSE_FILE" rm -sf "app-$ACTIVE_COLOR" 2>/dev/null || true
            docker rm -f "expenso-$ACTIVE_COLOR" 2>/dev/null || true

            {
              echo "ACTIVE_COLOR=$TARGET_COLOR"
              if [ "$TARGET_COLOR" = "blue" ]; then
                echo "BLUE_DIGEST=${NEW_DIGEST:-}"
                echo "GREEN_DIGEST=${GREEN_DIGEST:-}"
              else
                echo "BLUE_DIGEST=${BLUE_DIGEST:-}"
                echo "GREEN_DIGEST=${NEW_DIGEST:-}"
              fi
            } > "$STATE_FILE"

            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  DEPLOY SUCCESSFUL"
            echo "  Active: $TARGET_COLOR"
            echo "  Digest: $NEW_DIGEST"
            echo "════════════════════════════════════════════════════════════════"

      - name: Diagnostics on deploy failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_DEPLOY_PATH }}"
            echo ">>> State:"
            cat .bluegreen.state 2>/dev/null || echo "(none)"
            echo ">>> Nginx upstream:"
            grep 'set \$active_upstream' /etc/nginx/sites-available/expenso 2>/dev/null || true
            echo ">>> Containers:"
            docker compose -f docker-compose.prod.yml ps || true
            echo ">>> Logs (blue):"
            docker compose -f docker-compose.prod.yml logs --tail=30 app-blue || true
            echo ">>> Logs (green):"
            docker compose -f docker-compose.prod.yml logs --tail=30 app-green || true
            echo ">>> Resources:"
            free -h || true
            df -h || true

  # ═══════════════════════════════════════════════════════════════════════════
  # 6. Post-Deploy Verification + Automatic Rollback (INLINE)
  # ═══════════════════════════════════════════════════════════════════════════
  verify-production:
    name: Verify & Rollback Guard
    needs: [deploy-production]
    runs-on: ubuntu-24.04
    # Must be >= the longest SSH command_timeout in this job (rollback = 8m)
    # so the runner never kills the job mid-rollback.
    timeout-minutes: 10
    steps:
      - name: Verify public health endpoint
        id: verify
        run: |
          if [ -z "${{ secrets.PUBLIC_DOMAIN }}" ]; then
            echo "::error::PUBLIC_DOMAIN secret not set"
            exit 1
          fi
          echo ">>> Checking https://${{ secrets.PUBLIC_DOMAIN }}/api/health"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            --max-time 30 \
            --retry 5 --retry-delay 6 --retry-connrefused \
            https://${{ secrets.PUBLIC_DOMAIN }}/api/health)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          echo ">>> HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAILED: Expected 200, got $HTTP_STATUS"
            exit 1
          fi
          echo ">>> Public health check PASSED"

      - name: Automatic rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail

            cd "${{ secrets.SERVER_DEPLOY_PATH }}"
            STATE_FILE=".bluegreen.state"
            NGINX_SITE="${NGINX_SITE_PATH:-/etc/nginx/sites-available/expenso}"
            COMPOSE_FILE="docker-compose.prod.yml"

            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  AUTOMATIC ROLLBACK"
            echo "  Reason: external health check failed"
            echo "  Time:   $(date -Iseconds)"
            echo "════════════════════════════════════════════════════════════════"

            if [ ! -f "$STATE_FILE" ]; then
              echo "ERROR: No state file. Cannot rollback automatically."
              exit 1
            fi

            # shellcheck source=/dev/null
            source "$STATE_FILE"

            if [ "$ACTIVE_COLOR" = "blue" ]; then
              PREVIOUS_COLOR="green"
              PREVIOUS_DIGEST="${GREEN_DIGEST:-}"
              PREVIOUS_PORT=3001
            else
              PREVIOUS_COLOR="blue"
              PREVIOUS_DIGEST="${BLUE_DIGEST:-}"
              PREVIOUS_PORT=3000
            fi

            if [ -z "$PREVIOUS_DIGEST" ]; then
              echo "ERROR: No previous digest recorded. Cannot rollback."
              exit 1
            fi

            echo ">>> Rolling back: $ACTIVE_COLOR → $PREVIOUS_COLOR"

            # Ensure previous container is running
            REGISTRY="${REGISTRY:-docker.io}"
            IMAGE_NAME="${IMAGE_NAME:-devidolrun/expenso}"
            export "${PREVIOUS_COLOR^^}_IMAGE=${REGISTRY}/${IMAGE_NAME}@${PREVIOUS_DIGEST}"

            echo ">>> Starting $PREVIOUS_COLOR container..."
            docker compose -f "$COMPOSE_FILE" up -d --no-deps "app-$PREVIOUS_COLOR"

            # Quick health check — MUST verify success before switching nginx
            echo ">>> Health check on $PREVIOUS_COLOR (port $PREVIOUS_PORT)..."
            HEALTHY=false
            for i in $(seq 1 5); do
              if curl -sf "http://127.0.0.1:$PREVIOUS_PORT/api/health" >/dev/null 2>&1; then
                echo ">>> $PREVIOUS_COLOR is healthy"
                HEALTHY=true
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: $PREVIOUS_COLOR failed health checks. Rollback aborted — keeping $ACTIVE_COLOR live."
              exit 1
            fi

            # Switch nginx back
            echo ">>> Reverting nginx to $PREVIOUS_COLOR..."
            sudo sed -i "s/set\s*\\\$active_upstream\s\+\w\+;/set \$active_upstream $PREVIOUS_COLOR;/g" "$NGINX_SITE"
            sudo nginx -t && sudo nginx -s reload

            # Update state
            {
              echo "ACTIVE_COLOR=$PREVIOUS_COLOR"
              echo "BLUE_DIGEST=$BLUE_DIGEST"
              echo "GREEN_DIGEST=$GREEN_DIGEST"
            } > "$STATE_FILE"

            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  ROLLBACK COMPLETE"
            echo "  Active: $PREVIOUS_COLOR"
            echo "════════════════════════════════════════════════════════════════"
