name: Build, Security Scan & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: devidolrun/expenso
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Quality Gate
  # ═══════════════════════════════════════════════════════════════════════════
  quality:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.3
        with:
          package_json_file: package.json
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Integration Tests
  # ═══════════════════════════════════════════════════════════════════════════
  integration-test:
    name: Integration Tests
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DB_USER: expenso_test
      TEST_DB_NAME: expensodb_test
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}
      DATABASE_URL: postgresql://expenso_test:${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}@localhost:5432/expensodb_test
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: expenso_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}
          POSTGRES_DB: expensodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenso_test -d expensodb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.3
        with:
          package_json_file: package.json
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Deploy migrations
        run: |
          for i in 1 2 3; do
            echo ">>> Migration attempt $i..."
            pnpm run db:deploy && exit 0
            sleep 3
          done
          echo "Migrations failed"
          exit 1

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "Container status:"
          docker inspect "${{ job.services.postgres.id }}" --format='{{.State.Status}} | {{.State.Health.Status}}' 2>/dev/null || true
          echo "Logs:"
          docker logs "${{ job.services.postgres.id }}" 2>&1 || true

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Build, Scan, SBOM & Sign
  # ═══════════════════════════════════════════════════════════════════════════
  build-scan-sign:
    name: Build, Scan & Sign Image
    needs: [integration-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
          provenance: true
          sbom: true

      - name: Cache Trivy DB
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy container scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          scanners: 'vuln'
          ignore-unfixed: true

      - name: Gate on CRITICAL
        run: |
          if [ ! -f trivy-container-results.sarif ]; then
            echo "::warning::SARIF missing; skipping gate."
            exit 0
          fi
          COUNT=$(grep -o '"severity": "CRITICAL"' trivy-container-results.sarif | wc -l || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT CRITICAL finding(s). Review Security tab."
            exit 1
          fi
          echo "✅ No CRITICAL vulnerabilities."

      - name: Ensure SARIF exists
        if: always()
        run: |
          if [ ! -f trivy-container-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","informationUri":"https://github.com/aquasecurity/trivy"}},"results":[]}]}' > trivy-container-results.sarif
          fi

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3.28.16
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign image
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. Production Blue/Green Deploy (INLINE — no external scripts)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production (Blue/Green)
    needs: [build-scan-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Blue/Green deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            # ── Config ──────────────────────────────────────────────────────
            COMPOSE_FILE="docker-compose.prod.yml"
            STATE_FILE=".bluegreen.state"
            NGINX_SITE="${NGINX_SITE_PATH:-/etc/nginx/sites-available/expenso}"
            NEW_DIGEST="${{ needs.build-scan-sign.outputs.digest }}"
            REGISTRY="${REGISTRY:-docker.io}"
            IMAGE_NAME="${IMAGE_NAME:-devidolrun/expenso}"
            FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}@${NEW_DIGEST}"

            cd "${{ secrets.SERVER_DEPLOY_PATH }}"
            echo ">>> Working directory: $(pwd)"
            echo ">>> Disk: $(df -h . | tail -1)"

            # ── Detect active color ─────────────────────────────────────────
            ACTIVE_COLOR=$(grep -oP 'set\s+\$active_upstream\s+\K\w+' "$NGINX_SITE" 2>/dev/null || true)
            if [ -z "$ACTIVE_COLOR" ] || { [ "$ACTIVE_COLOR" != "blue" ] && [ "$ACTIVE_COLOR" != "green" ]; }; then
              ACTIVE_COLOR="blue"
            fi

            # ── Determine target ────────────────────────────────────────────
            if [ "$ACTIVE_COLOR" = "blue" ]; then
              TARGET_COLOR="green"
              TARGET_PORT=3001
            else
              TARGET_COLOR="blue"
              TARGET_PORT=3000
            fi

            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  BLUE/GREEN DEPLOY"
            echo "  Active: $ACTIVE_COLOR  →  Target: $TARGET_COLOR (port $TARGET_PORT)"
            echo "  Image:  $FULL_IMAGE"
            echo "════════════════════════════════════════════════════════════════"

            # ── Step 1: Clean up & deploy target ────────────────────────────
            echo ">>> [1/5] Cleaning up existing $TARGET_COLOR container..."
            docker compose -f "$COMPOSE_FILE" rm -sf "app-$TARGET_COLOR" 2>/dev/null || true

            echo ">>> [2/5] Pulling image for $TARGET_COLOR..."
            export "${TARGET_COLOR^^}_IMAGE=$FULL_IMAGE"
            docker compose -f "$COMPOSE_FILE" pull "app-$TARGET_COLOR"

            echo ">>> [3/5] Starting $TARGET_COLOR container..."
            docker compose -f "$COMPOSE_FILE" up -d "app-$TARGET_COLOR"

            # ── Step 2: Health check ────────────────────────────────────────
            echo ">>> [4/5] Health check on $TARGET_COLOR (localhost:$TARGET_PORT)..."
            HEALTHY=false
            for i in 1 2 3 4 5; do
              echo ">>>   Attempt $i/5..."
              if curl -sf "http://127.0.0.1:$TARGET_PORT/api/health" >/dev/null 2>&1; then
                echo ">>>   HTTP 200 OK"
                HEALTHY=true
                break
              fi
              # Also show Docker health status for observability
              DOCKER_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "expenso-$TARGET_COLOR" 2>/dev/null || echo "unknown")
              echo ">>>   Docker health: $DOCKER_HEALTH"
              sleep 3
            done

            if [ "$HEALTHY" != "true" ]; then
              echo ""
              echo "ERROR: $TARGET_COLOR failed health checks."
              echo ">>> Destroying $TARGET_COLOR container..."
              docker compose -f "$COMPOSE_FILE" rm -sf "app-$TARGET_COLOR" 2>/dev/null || true
              echo ">>> Kept $ACTIVE_COLOR running. Users unaffected."
              echo "════════════════════════════════════════════════════════════════"
              echo "  DEPLOY FAILED — No traffic was switched"
              echo "════════════════════════════════════════════════════════════════"
              exit 1
            fi

            # ── Step 3: Switch traffic ──────────────────────────────────────
            echo ">>> [5/5] Switching nginx from $ACTIVE_COLOR → $TARGET_COLOR..."
            sudo sed -i "s/set\s*\\\$active_upstream\s\+\w\+;/set \$active_upstream $TARGET_COLOR;/g" "$NGINX_SITE"

            echo ">>> Testing nginx config..."
            sudo nginx -t

            echo ">>> Reloading nginx gracefully..."
            sudo nginx -s reload

            # ── Step 4: Grace period & cleanup ──────────────────────────────
            echo ">>> Waiting 10s for connection drain..."
            sleep 10

            echo ">>> Stopping previous $ACTIVE_COLOR container..."
            docker compose -f "$COMPOSE_FILE" stop "app-$ACTIVE_COLOR" 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" rm -sf "app-$ACTIVE_COLOR" 2>/dev/null || true

            # ── Save state ──────────────────────────────────────────────────
            cat > "$STATE_FILE" <<EOF
ACTIVE_COLOR=$TARGET_COLOR
BLUE_DIGEST=$([ "$TARGET_COLOR" = "blue" ] && echo "$NEW_DIGEST" || echo "$BLUE_DIGEST")
GREEN_DIGEST=$([ "$TARGET_COLOR" = "green" ] && echo "$NEW_DIGEST" || echo "$GREEN_DIGEST")
EOF

            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  DEPLOY SUCCESSFUL"
            echo "  Active: $TARGET_COLOR"
            echo "  Digest: $NEW_DIGEST"
            echo "════════════════════════════════════════════════════════════════"

      - name: Diagnostics on deploy failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_DEPLOY_PATH }}"
            echo ">>> State:"
            cat .bluegreen.state 2>/dev/null || echo "(none)"
            echo ">>> Nginx upstream:"
            grep 'set \$active_upstream' /etc/nginx/sites-available/expenso 2>/dev/null || true
            echo ">>> Containers:"
            docker compose -f docker-compose.prod.yml ps || true
            echo ">>> Logs (blue):"
            docker compose -f docker-compose.prod.yml logs --tail=30 app-blue || true
            echo ">>> Logs (green):"
            docker compose -f docker-compose.prod.yml logs --tail=30 app-green || true
            echo ">>> Resources:"
            free -h || true
            df -h || true

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. Post-Deploy Verification + Automatic Rollback (INLINE)
  # ═══════════════════════════════════════════════════════════════════════════
  verify-production:
    name: Verify & Rollback Guard
    needs: [deploy-production]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public health endpoint
        id: verify
        run: |
          if [ -z "${{ secrets.PUBLIC_DOMAIN }}" ]; then
            echo "::error::PUBLIC_DOMAIN secret not set"
            exit 1
          fi
          echo ">>> Checking https://${{ secrets.PUBLIC_DOMAIN }}/api/health"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            --max-time 30 \
            --retry 5 --retry-delay 6 --retry-connrefused \
            https://${{ secrets.PUBLIC_DOMAIN }}/api/health)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          echo ">>> HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAILED: Expected 200, got $HTTP_STATUS"
            exit 1
          fi
          echo ">>> Public health check PASSED"

      - name: Automatic rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail

            cd "${{ secrets.SERVER_DEPLOY_PATH }}"
            STATE_FILE=".bluegreen.state"
            NGINX_SITE="${NGINX_SITE_PATH:-/etc/nginx/sites-available/expenso}"
            COMPOSE_FILE="docker-compose.prod.yml"

            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  AUTOMATIC ROLLBACK"
            echo "  Reason: external health check failed"
            echo "  Time:   $(date -Iseconds)"
            echo "════════════════════════════════════════════════════════════════"

            if [ ! -f "$STATE_FILE" ]; then
              echo "ERROR: No state file. Cannot rollback automatically."
              exit 1
            fi

            # shellcheck source=/dev/null
            source "$STATE_FILE"

            if [ "$ACTIVE_COLOR" = "blue" ]; then
              PREVIOUS_COLOR="green"
              PREVIOUS_DIGEST="${GREEN_DIGEST:-}"
              PREVIOUS_PORT=3001
            else
              PREVIOUS_COLOR="blue"
              PREVIOUS_DIGEST="${BLUE_DIGEST:-}"
              PREVIOUS_PORT=3000
            fi

            if [ -z "$PREVIOUS_DIGEST" ]; then
              echo "ERROR: No previous digest recorded. Cannot rollback."
              exit 1
            fi

            echo ">>> Rolling back: $ACTIVE_COLOR → $PREVIOUS_COLOR"

            # Ensure previous container is running
            REGISTRY="${REGISTRY:-docker.io}"
            IMAGE_NAME="${IMAGE_NAME:-devidolrun/expenso}"
            export "${PREVIOUS_COLOR^^}_IMAGE=${REGISTRY}/${IMAGE_NAME}@${PREVIOUS_DIGEST}"

            echo ">>> Starting $PREVIOUS_COLOR container..."
            docker compose -f "$COMPOSE_FILE" up -d "app-$PREVIOUS_COLOR"

            # Quick health check
            echo ">>> Health check on $PREVIOUS_COLOR (port $PREVIOUS_PORT)..."
            for i in 1 2 3 4 5; do
              if curl -sf "http://127.0.0.1:$PREVIOUS_PORT/api/health" >/dev/null 2>&1; then
                echo ">>> $PREVIOUS_COLOR is healthy"
                break
              fi
              sleep 3
            done

            # Switch nginx back
            echo ">>> Reverting nginx to $PREVIOUS_COLOR..."
            sudo sed -i "s/set\s*\\\$active_upstream\s\+\w\+;/set \$active_upstream $PREVIOUS_COLOR;/g" "$NGINX_SITE"
            sudo nginx -t && sudo nginx -s reload

            # Update state
            cat > "$STATE_FILE" <<EOF
ACTIVE_COLOR=$PREVIOUS_COLOR
BLUE_DIGEST=$BLUE_DIGEST
GREEN_DIGEST=$GREEN_DIGEST
EOF

            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  ROLLBACK COMPLETE"
            echo "  Active: $PREVIOUS_COLOR"
            echo "════════════════════════════════════════════════════════════════"
