name: Build, Security Scan & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: devidolrun/expenso
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Quality Gate
  # ═══════════════════════════════════════════════════════════════════════════
  quality:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.3
        with:
          package_json_file: package.json
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Integration Tests (requires real Postgres)
  # ═══════════════════════════════════════════════════════════════════════════
  integration-test:
    name: Integration Tests
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DB_USER: expenso_test
      TEST_DB_NAME: expensodb_test
      # Fallback to a hardcoded test password if the secret is not set.
      # For production CI, set secrets.TEST_DB_PASSWORD in the repository settings.
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}
      DATABASE_URL: postgresql://expenso_test:${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}@localhost:5432/expensodb_test
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: expenso_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'expenso_test_ci_password' }}
          POSTGRES_DB: expensodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenso_test -d expensodb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Validate test configuration
        run: |
          if [ -z "$TEST_DB_PASSWORD" ]; then
            echo "::error::TEST_DB_PASSWORD is empty. Set the secrets.TEST_DB_PASSWORD repository secret."
            exit 1
          fi
          echo ">>> Test DB config validated"
          echo ">>> Host: localhost:5432"
          echo ">>> User: $TEST_DB_USER"
          echo ">>> Database: $TEST_DB_NAME"

      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.3
        with:
          package_json_file: package.json
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug PostgreSQL service status
        run: |
          echo ">>> Docker containers:"
          docker ps -a
          echo ""
          echo ">>> Postgres container logs (last 30 lines):"
          docker logs "${{ job.services.postgres.id }}" 2>&1 | tail -n 30 || true
          echo ""
          echo ">>> Running healthcheck manually:"
          docker exec "${{ job.services.postgres.id }}" pg_isready -U "$TEST_DB_USER" -d "$TEST_DB_NAME" || true
          echo ""
          echo ">>> Testing SQL connectivity:"
          docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" "${{ job.services.postgres.id }}" psql -U "$TEST_DB_USER" -d "$TEST_DB_NAME" -c "SELECT 1 AS health;" || true

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Deploy migrations to test database
        run: |
          for i in 1 2 3; do
            echo ">>> Migration attempt $i..."
            if pnpm run db:deploy; then
              echo ">>> Migrations applied successfully"
              exit 0
            fi
            echo ">>> Migration attempt $i failed, waiting 3s..."
            sleep 3
          done
          echo ">>> All migration attempts failed"
          exit 1

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Dump PostgreSQL diagnostics on failure
        if: failure()
        run: |
          echo "==================== POSTGRESQL FAILURE DIAGNOSTICS ===================="
          echo ">>> Container status:"
          docker inspect "${{ job.services.postgres.id }}" --format='Status: {{.State.Status}} | Health: {{.State.Health.Status}}' 2>/dev/null || true
          echo ""
          echo ">>> Full container logs:"
          docker logs "${{ job.services.postgres.id }}" 2>&1 || true
          echo ""
          echo ">>> Environment check:"
          echo "TEST_DB_PASSWORD is set: $([ -n "$TEST_DB_PASSWORD" ] && echo YES || echo NO)"
          echo "======================================================================="

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Build, Container Scan, SBOM & Sign
  # ═══════════════════════════════════════════════════════════════════════════
  build-scan-sign:
    name: Build, Scan & Sign Image
    needs: [integration-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
          provenance: true
          sbom: true

      # ── Trivy DB cache ───────────────────────────────────────────────────────
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # ═══════════════════════════════════════════════════════════════════════════
      # Trivy Container Scan — Option B (Balanced)
      #   Scans: HIGH + CRITICAL  |  Fails: CRITICAL only  |  ignore-unfixed: true
      # ═══════════════════════════════════════════════════════════════════════════
      - name: Run Trivy container scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          scanners: 'vuln'
          ignore-unfixed: true

      # ── Fail only on CRITICAL (manual gate for Option B behavior) ──────────────
      - name: Gate on CRITICAL vulnerabilities
        run: |
          if [ ! -f trivy-container-results.sarif ]; then
            echo "::warning::SARIF file missing; skipping CRITICAL gate."
            exit 0
          fi
          CRITICAL_COUNT=$(grep -o '"severity": "CRITICAL"' trivy-container-results.sarif | wc -l || echo 0)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::$CRITICAL_COUNT CRITICAL vulnerability(ies) detected in container image."
            echo "::error::Review the SARIF output in the GitHub Security tab."
            exit 1
          fi
          echo "✅ No CRITICAL vulnerabilities found."

      # ── SARIF safety net ─────────────────────────────────────────────────────
      - name: Ensure Trivy SARIF exists
        if: always()
        run: |
          if [ ! -f trivy-container-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","informationUri":"https://github.com/aquasecurity/trivy"}},"results":[]}]}' > trivy-container-results.sarif
            echo "::warning::Trivy did not produce a SARIF file; created empty placeholder."
          fi

      - name: Upload Trivy container SARIF
        uses: github/codeql-action/upload-sarif@v3.28.16
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'

      - name: Post Trivy scan summary
        if: always()
        run: |
          echo "### 🔒 Trivy Container Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.trivy.outcome }}" == "failure" ]; then
            echo "- **Status**: ❌ FAILED (scan execution error)" >> $GITHUB_STEP_SUMMARY
          else
            CRITICAL_COUNT=$(grep -o '"severity": "CRITICAL"' trivy-container-results.sarif | wc -l || echo 0)
            HIGH_COUNT=$(grep -o '"severity": "HIGH"' trivy-container-results.sarif | wc -l || echo 0)
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "- **Status**: ❌ GATE FAILED ($CRITICAL_COUNT CRITICAL)" >> $GITHUB_STEP_SUMMARY
              echo "- **Action required**: Patch or suppress CRITICAL findings." >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Status**: ✅ PASSED (no CRITICAL vulnerabilities)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "- **HIGH findings**: $HIGH_COUNT (non-blocking, visible in Security tab)" >> $GITHUB_STEP_SUMMARY
            echo "- **CRITICAL findings**: $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Policy**: Option B — Balanced (report HIGH+CRITICAL, fail only on CRITICAL)" >> $GITHUB_STEP_SUMMARY

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      # ── Debug: validate digest format before signing ───────────────────────────
      - name: Print image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Full reference: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. Staging Deploy (automatic)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    needs: [build-scan-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.STAGING_SERVER_DEPLOY_PATH }}
            echo ">>> Deploying sha-${{ github.sha }} to staging"
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=sha-${{ github.sha }}/" .env.production
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans app
            echo ">>> Staging deploy complete"

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. Production Deploy (manual approval required)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    needs: [build-scan-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy to production VPS
        id: deploy-ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail
            echo "=============================="
            echo "DEPLOY START: $(date)"
            echo "SHA: sha-${{ github.sha }}"
            echo "=============================="

            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            echo ">>> Working directory: $(pwd)"
            echo ">>> Disk space: $(df -h . | tail -1)"

            PREVIOUS_TAG=$(grep IMAGE_TAG .env.production | cut -d '=' -f2 || echo "none")
            echo ">>> Previous IMAGE_TAG: $PREVIOUS_TAG"
            echo "$PREVIOUS_TAG" > .previous_tag

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=sha-${{ github.sha }}/" .env.production
            echo ">>> Updated IMAGE_TAG to: sha-${{ github.sha }}"

            echo ">>> Pulling new image..."
            docker compose -f docker-compose.prod.yml pull app
            echo ">>> Pull complete"

            echo ">>> Starting app container..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans app
            echo ">>> Container started"

            echo ">>> Waiting 20s for app to initialize..."
            sleep 20

            echo ">>> App container logs (last 50 lines):"
            docker compose -f docker-compose.prod.yml logs --tail=50 app || true

            echo ">>> Running health check..."
            bash scripts/healthcheck.sh

            echo "=============================="
            echo "DEPLOY SUCCESS: sha-${{ github.sha }}"
            echo "TIME: $(date)"
            echo "=============================="

      - name: Dump container logs on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 8m
          script_stop: true
          script: |
            echo "=============================="
            echo "FAILURE DIAGNOSTICS"
            echo "=============================="
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml ps || true
            docker compose -f docker-compose.prod.yml logs --tail=100 app || true
            docker compose -f docker-compose.prod.yml logs --tail=30 db || true
            free -h || true
            df -h || true
            docker ps -a || true
            docker images | grep "expenso" || true
            echo "=============================="

  # ═══════════════════════════════════════════════════════════════════════════
  # 6. Post-Deploy Verification
  # ═══════════════════════════════════════════════════════════════════════════
  verify-production:
    name: Post-Deploy Verification
    needs: [deploy-production]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public health endpoint
        id: verify-curl
        run: |
          if [ -z "${{ secrets.PUBLIC_DOMAIN }}" ]; then
            echo "::error::PUBLIC_DOMAIN secret is not set"
            exit 1
          fi
          echo ">>> Checking https://${{ secrets.PUBLIC_DOMAIN }}/api/health"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            --max-time 30 \
            --retry 5 --retry-delay 6 --retry-connrefused \
            https://${{ secrets.PUBLIC_DOMAIN }}/api/health)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          echo ">>> Response body: $BODY"
          echo ">>> HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo ">>> FAILED: Expected 200, got $HTTP_STATUS"
            exit 1
          fi
          echo ">>> Health check PASSED"

      - name: Rollback on verification failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 8m
          script_stop: true
          script: |
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            PREVIOUS_TAG=$(cat .previous_tag)
            echo ">>> Rolling back to: $PREVIOUS_TAG"
            bash scripts/rollback.sh "$PREVIOUS_TAG"
