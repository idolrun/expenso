name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.28.16
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3.28.16

      - name: Analyze
        uses: github/codeql-action/analyze@v3.28.16

  sca-secrets:
    name: SCA, Secret & Filesystem Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # ═══════════════════════════════════════════════════════════════════════
      # TruffleHog — Secret Detection
      # ═══════════════════════════════════════════════════════════════════════
      # PRs: scan the diff between base and head (fast, targeted).
      # Push/Schedule: scan the full repo (comprehensive).
      # continue-on-error ensures the pipeline never fails because of
      # scanning edge cases (empty diffs, network flakes, etc.).
      # ═══════════════════════════════════════════════════════════════════════

      - name: TruffleHog (PR diff scan)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog (full repo scan)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          extra_args: --only-verified

      # ═══════════════════════════════════════════════════════════════════════
      # Trivy — Filesystem Vulnerability Scan
      # ═══════════════════════════════════════════════════════════════════════
      # Policy: CRITICAL only | fail on CRITICAL | ignore unfixed upstream CVEs.
      # HIGH vulnerabilities are NOT blocking but may still be reviewed manually
      # via Dependabot or periodic full scans.
      # ═══════════════════════════════════════════════════════════════════════

      - name: Cache Trivy DB
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          scanners: 'vuln'
          ignore-unfixed: true

      - name: Ensure Trivy SARIF exists
        if: always()
        run: |
          if [ ! -f trivy-fs-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","informationUri":"https://github.com/aquasecurity/trivy"}},"results":[]}]}' > trivy-fs-results.sarif
            echo "::warning::Trivy did not produce SARIF; created empty placeholder."
          fi

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3.28.16
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
