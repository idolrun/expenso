name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.28.16
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3.28.16

      - name: Analyze
        uses: github/codeql-action/analyze@v3.28.16

  sca-secrets:
    name: SCA, Secret & Filesystem Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # ═══════════════════════════════════════════════════════════════════════
      # Dependency Installation (required for accurate Trivy scanning)
      # ═══════════════════════════════════════════════════════════════════════
      # Trivy needs installed node_modules to properly resolve npm/pnpm
      # package trees. Without this, Trivy may report:
      #   "pnpm install needs to be performed beforehand"
      # ═══════════════════════════════════════════════════════════════════════

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.4
        with:
          package_json_file: package.json
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ═══════════════════════════════════════════════════════════════════════
      # TruffleHog — Secret Detection
      # ═══════════════════════════════════════════════════════════════════════
      # PRs: scan the diff between base and head (fast, targeted).
      # Push/Schedule: scan the full repo (comprehensive).
      # continue-on-error prevents the pipeline from failing on scanning
      # edge cases (empty diffs, network flakes, same base/head, etc.).
      # ═══════════════════════════════════════════════════════════════════════

      - name: TruffleHog (PR diff scan)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog (full repo scan)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          extra_args: --only-verified

      # ═══════════════════════════════════════════════════════════════════════
      # Trivy — Filesystem Vulnerability Scan
      # ═══════════════════════════════════════════════════════════════════════
      # Policy:
      #   • PRs (including Dependabot): report HIGH+CRITICAL, NEVER fail.
      #     This keeps PRs unblocked while still uploading findings to the
      #     Security tab for review.
      #   • Push/Schedule: report HIGH+CRITICAL, FAIL only on CRITICAL.
      #     This protects the main branch from shipping CRITICAL vulns.
      # ═══════════════════════════════════════════════════════════════════════

      - name: Cache Trivy DB
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          scanners: 'vuln'
          ignore-unfixed: true

      - name: Gate on CRITICAL (blocking on push/schedule only)
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -f trivy-fs-results.sarif ]; then
            echo "::warning::SARIF missing; skipping CRITICAL gate."
            exit 0
          fi
          COUNT=$(grep -o '"severity": "CRITICAL"' trivy-fs-results.sarif | wc -l || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT CRITICAL finding(s) in filesystem scan."
            exit 1
          fi
          echo "✅ No CRITICAL vulnerabilities."

      - name: Ensure Trivy SARIF exists
        if: always()
        run: |
          if [ ! -f trivy-fs-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","informationUri":"https://github.com/aquasecurity/trivy"}},"results":[]}]}' > trivy-fs-results.sarif
            echo "::warning::Trivy did not produce SARIF; created empty placeholder."
          fi

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3.28.16
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-fs-results.sarif'
