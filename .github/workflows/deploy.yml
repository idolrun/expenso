name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: devidolrun/expenso
  IMAGE_TAG: sha-${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          echo ">>> Installing dependencies..."
          pnpm install --frozen-lockfile
          echo ">>> Dependencies installed"

      - name: Generate Prisma client
        run: |
          echo ">>> Generating Prisma client..."
          pnpm run db:generate
          echo ">>> Prisma client generated"

      - name: Run ESLint
        run: |
          echo ">>> Running ESLint..."
          pnpm run lint
          echo ">>> ESLint passed"

      - name: Run TypeScript type check
        run: |
          echo ">>> Running TypeScript type check..."
          pnpm run typecheck
          echo ">>> Type check passed"

      - name: Run unit tests
        run: |
          echo ">>> Running unit tests..."
          pnpm run test
          echo ">>> Unit tests passed"

  integration-test:
    name: Integration Tests
    needs: [quality]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expenso_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: expensodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          echo ">>> Installing dependencies..."
          pnpm install --frozen-lockfile
          echo ">>> Dependencies installed"

      - name: Generate Prisma client
        run: |
          echo ">>> Generating Prisma client..."
          pnpm run db:generate
          echo ">>> Prisma client generated"
        env:
          DATABASE_URL: postgresql://expenso_test:test_password@localhost:5432/expensodb_test

      - name: Deploy migrations to test database
        run: |
          echo ">>> Deploying migrations to test database..."
          pnpm run db:deploy
          echo ">>> Migrations deployed"
        env:
          DATABASE_URL: postgresql://expenso_test:test_password@localhost:5432/expensodb_test

      - name: Run integration tests
        run: |
          echo ">>> Running integration tests..."
          pnpm run test:integration
          echo ">>> Integration tests passed"
        env:
          DATABASE_URL: postgresql://expenso_test:test_password@localhost:5432/expensodb_test

  build-push:
    name: Build & Push Docker Image
    needs: [integration-test]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Output image digest
        run: |
          echo ">>> Image digest: ${{ steps.build.outputs.digest }}"

  deploy:
    name: Deploy to VPS
    needs: [build-push]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        id: deploy-ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          debug: true
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail

            echo "=============================="
            echo "DEPLOY START: $(date)"
            echo "SHA: sha-${{ github.sha }}"
            echo "=============================="

            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            echo ">>> Working directory: $(pwd)"
            echo ">>> Disk space: $(df -h . | tail -1)"

            # Store previous image tag for potential rollback
            PREVIOUS_TAG=$(grep IMAGE_TAG .env.production | cut -d '=' -f2 || echo "none")
            echo ">>> Previous IMAGE_TAG: $PREVIOUS_TAG"
            echo "$PREVIOUS_TAG" > .previous_tag

            # Update image tag in .env.production
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=sha-${{ github.sha }}/" .env.production
            echo ">>> Updated IMAGE_TAG to: sha-${{ github.sha }}"
            echo ">>> Verifying .env.production IMAGE_TAG:"
            grep IMAGE_TAG .env.production

            # Pull new image
            echo ">>> Pulling new image..."
            docker compose -f docker-compose.prod.yml pull app
            echo ">>> Pull complete"
            echo ">>> Verifying image exists:"
            docker images | grep "expenso" || true

            # Rolling restart
            echo ">>> Starting app container..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans app
            echo ">>> Container started"

            # Show container status
            echo ">>> Container status:"
            docker compose -f docker-compose.prod.yml ps

            # Wait for startup
            echo ">>> Waiting 20s for app to initialize..."
            sleep 20

            # Show app logs
            echo ">>> App container logs (last 50 lines):"
            docker compose -f docker-compose.prod.yml logs --tail=50 app || true

            # Health check
            echo ">>> Running health check..."
            bash scripts/healthcheck.sh

            echo "=============================="
            echo "DEPLOY SUCCESS: sha-${{ github.sha }}"
            echo "TIME: $(date)"
            echo "=============================="

      - name: Dump container logs on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          debug: true
          command_timeout: 8m
          script_stop: true
          script: |
            echo "=============================="
            echo "FAILURE DIAGNOSTICS"
            echo "=============================="
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            echo ">>> Docker compose status:"
            docker compose -f docker-compose.prod.yml ps || true
            echo ">>> App container logs (last 100 lines):"
            docker compose -f docker-compose.prod.yml logs --tail=100 app || true
            echo ">>> DB container logs (last 30 lines):"
            docker compose -f docker-compose.prod.yml logs --tail=30 db || true
            echo ">>> System resources:"
            free -h || true
            df -h || true
            echo ">>> Running containers:"
            docker ps -a || true
            echo ">>> Image list:"
            docker images | grep "expenso" || true
            echo "=============================="

  verify:
    name: Post-Deploy Verification
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify public health endpoint
        id: verify-curl
        run: |
          echo ">>> Checking https://${{ secrets.PUBLIC_DOMAIN }}/api/health"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            --retry 5 --retry-delay 6 --retry-connrefused \
            https://${{ secrets.PUBLIC_DOMAIN }}/api/health)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          echo ">>> Response body: $BODY"
          echo ">>> HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo ">>> FAILED: Expected 200, got $HTTP_STATUS"
            exit 1
          fi
          echo ">>> Health check PASSED"

      - name: Rollback on verification failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          debug: true
          command_timeout: 8m
          script_stop: true
          script: |
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            PREVIOUS_TAG=$(cat .previous_tag)
            echo ">>> Rolling back to: $PREVIOUS_TAG"
            bash scripts/rollback.sh "$PREVIOUS_TAG"
