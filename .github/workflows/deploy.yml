name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: devidolrun/expenso
  IMAGE_TAG: sha-${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

  integration-test:
    name: Integration Tests
    needs: [quality]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expenso_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: expensodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate
        env:
          DATABASE_URL: postgresql://expenso_test:test_password@localhost:5432/expensodb_test

      - name: Deploy migrations to test database
        run: pnpm run db:deploy
        env:
          DATABASE_URL: postgresql://expenso_test:test_password@localhost:5432/expensodb_test

      - name: Run integration tests
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://expenso_test:test_password@localhost:5432/expensodb_test

  build-push:
    name: Build & Push Docker Image
    needs: [integration-test]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Output image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

  deploy:
    name: Deploy to VPS
    needs: [build-push]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        id: deploy-ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Trace every command and dump diagnostics on any error
            set -euxo pipefail

            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            echo "=== Working directory: $(pwd) ==="
            echo "=== Current Docker status ==="
            docker compose -f docker-compose.prod.yml ps || true
            echo "=== Disk usage ==="
            df -h | grep -E '(/$|/var)'

            # Store previous image tag for potential rollback
            PREVIOUS_TAG=$(grep IMAGE_TAG .env.production | cut -d '=' -f2)
            echo "Previous tag: $PREVIOUS_TAG"
            echo "$PREVIOUS_TAG" > .previous_tag

            # Update image tag in .env.production
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=sha-${{ github.sha }}/" .env.production
            echo "Updated .env.production IMAGE_TAG to: sha-${{ github.sha }}"

            # Pull new image
            echo "=== Pulling new image ==="
            docker compose -f docker-compose.prod.yml pull app
            echo "=== Verifying image exists ==="
            docker images | grep "expenso" || true

            # Rolling restart
            echo "=== Restarting app container ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans app
            echo "=== Post-start container status ==="
            docker compose -f docker-compose.prod.yml ps

            # Wait for service to start
            echo "=== Waiting 15s for service startup ==="
            sleep 15

            # Dump recent logs before healthcheck so we can see startup errors
            echo "=== App container logs (last 50 lines) ==="
            docker compose -f docker-compose.prod.yml logs --tail=50 app || true

            # Health check
            echo "=== Running health check ==="
            if bash scripts/healthcheck.sh; then
              echo "=== Deployment successful: sha-${{ github.sha }} ==="
              exit 0
            fi

            # If we get here, healthcheck failed — auto-rollback
            echo "=== HEALTHCHECK FAILED — initiating rollback to $PREVIOUS_TAG ==="
            echo "=== App container logs at failure (last 100 lines) ==="
            docker compose -f docker-compose.prod.yml logs --tail=100 app || true
            echo "=== All container statuses ==="
            docker compose -f docker-compose.prod.yml ps || true

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env.production
            docker compose -f docker-compose.prod.yml pull app || true
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            sleep 10
            echo "=== Rollback health check ==="
            bash scripts/healthcheck.sh || true
            echo "=== Rollback complete ==="
            exit 1

      - name: Upload deploy logs artifact
        if: failure()
        run: |
          echo "Deploy step failed. Check the 'Deploy via SSH' step output above for full logs."

  verify:
    name: Post-Deploy Verification
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify public health endpoint
        id: verify-curl
        run: |
          echo "=== Checking public health endpoint ==="
          curl -v -f --retry 5 --retry-delay 5 \
            https://${{ secrets.PUBLIC_DOMAIN }}/api/health

      - name: Rollback on verification failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euxo pipefail
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            PREVIOUS_TAG=$(cat .previous_tag)
            echo "=== Verify failed — rolling back to $PREVIOUS_TAG ==="
            bash scripts/rollback.sh "$PREVIOUS_TAG"
